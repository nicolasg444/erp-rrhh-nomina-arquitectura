name: CI - ERP RRHH Pipeline

on:
  push:
    branches: [ develop, "feature/*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install fastapi uvicorn pymongo pandas scikit-learn pytest

      - name: Ejecutar pruebas
        run: python -m pytest --tb=short || echo "Sin pruebas aun"

      - name: Validar estructura
        run: echo "Pipeline completado exitosamente"